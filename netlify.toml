[build]
  command = "npm run build"
  publish = "dist"

[functions."risk-snapshot"]
  schedule = "55 23 * * *"

[dev]
  command = "vite"
  port = 8888
  targetPort = 5173

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
